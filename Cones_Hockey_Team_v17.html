<title>Cones Hockey Team v17</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b131a;font-family:Arial,sans-serif;color:#fff}
body{padding:7px}.app{width:min(100%,520px);margin:auto}
.header{height:61px;display:flex;align-items:center;gap:8px}
.logo{width:56px;height:56px;object-fit:contain}
.brand{line-height:.9;font-weight:900}.cones{font-size:23px;color:#09abe9;letter-spacing:1px}
.hockey{font-size:10px;letter-spacing:2px;margin-top:3px}.belgrade{font-size:7px;letter-spacing:3px;color:#9ba6ae;margin-top:3px}
.tabs{display:flex;gap:6px;margin-bottom:7px}
.tab{flex:1;padding:10px;border-radius:9px;border:1px solid #4c5962;background:#27313a;color:#a8b0b5;font-weight:900;font-size:13px}
.tab.active{background:#08abe8;color:#fff;border-color:#08abe8;box-shadow:0 0 0 2px #087ca7,0 0 15px #08abe866}
.absent-wrap{position:relative;margin-bottom:7px}
.absent-btn{width:100%;padding:9px;border-radius:9px;border:1px solid #71333a;background:#2b2024;color:#ff8d96;font-weight:900;font-size:12px}
.absent-btn.active{background:#9b2833;color:#fff;border-color:#d94a56}
.absent-panel{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:30;background:#182128;border:1px solid #45535d;border-radius:10px;padding:8px;box-shadow:0 10px 25px #0009;max-height:65vh;overflow:auto}
.absent-panel.open{display:block}
.absent-title{font-size:11px;font-weight:900;color:#fff;margin:2px 3px 7px}
.absent-list{display:grid;grid-template-columns:1fr;gap:4px}
.absent-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;background:#253039;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.absent-item input{width:17px;height:17px;accent-color:#e0313e}
.absent-item.is-absent{background:#8d2630;color:#fff}
.absent-item.is-absent .absent-name{text-decoration:line-through}
.absent-x{margin-left:auto;font-size:14px}
.absent-note{font-size:9px;color:#aab3b9;margin:6px 3px 2px}

.slot{position:absolute;transform:translate(-50%,-50%);width:27%;z-index:5;text-align:center}
.slot select{width:100%;padding:5px 3px;border:1px solid #68757e;border-radius:7px;background:#fff;color:#111;font-size:9px;font-weight:700;box-shadow:0 2px 5px #0003}
.slot select option:disabled{color:#999;background:#dedede}
.slot select option.absent-option{color:#b34a4a;background:#f8dddd}
.lab{display:block;color:#0b1116;font-size:11px;font-weight:900;line-height:1;margin-bottom:2px;text-shadow:0 1px 0 #fff}
.mark{height:24px;display:flex;align-items:center;justify-content:center}
.jersey{width:22px;height:22px;object-fit:contain}
/* Main positions */
.ag{left:50%;top:13.4%}.ald{left:28%;top:25%}.ard{left:72%;top:25%}
.alw{left:28%;top:35.5%}.arw{left:72%;top:35.5%}.ac{left:50%;top:42%}
.bg{left:50%;top:86.6%}.bld{left:28%;top:75%}.brd{left:72%;top:75%}
.blw{left:28%;top:64.5%}.brw{left:72%;top:64.5%}.bc{left:50%;top:58%}
/* Rotation slots: upper-left/right corner and lower-left/right corner */
.rtl{left:17%;top:8.5%}.rtr{left:83%;top:8.5%}
.rbl{left:17%;top:91.5%}.rbr{left:83%;top:91.5%}
.rotation{width:21%}
.rotation .lab{font-size:10px}
.rotation .mark{height:22px}
.rotation .jersey{width:20px;height:20px}
@media(max-width:380px){
 .slot{width:29%}.slot select{font-size:8px;padding:5px}
 .lab{font-size:10px}.jersey{width:20px;height:20px}
 .rotation{width:23%}.rotation .lab{font-size:9px}
}

/* BASIC lineup screen */
.basic-screen{display:none;min-height:calc(100vh - 125px);background:#07528a;border:1px solid #0b78b7;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 30px #001b33aa}
.basic-screen.open{display:block}
.basic-team{padding:10px 9px 12px}
.basic-blue{background:#07528a}
.basic-white{background:#0b63a0;border-top:3px solid #d8e5ec}
.basic-team-title{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:900;letter-spacing:1px;margin:0 2px 8px;text-align:center;color:#fff}
.basic-team-title img{width:24px;height:24px;object-fit:contain;flex:0 0 24px}.basic-team-title .title-text{display:flex;flex-direction:column;align-items:center;line-height:1.05}.basic-team-title .title-sub{font-size:8px;letter-spacing:1px;color:#b8d8ea;margin-top:3px}
.basic-team-title span{font-size:8px;letter-spacing:1px;color:#b8d8ea;margin-left:5px}
.basic-row{display:grid;grid-template-columns:37% 63%;align-items:center;min-height:51px;padding:4px 0;border-bottom:1px solid #ffffff22}
.basic-control{padding-right:7px}
.basic-control label{display:block;font-size:9px;font-weight:900;color:#eaf7ff;margin:0 0 4px;text-transform:uppercase;letter-spacing:.2px}
.basic-select{width:100%;height:34px;border:1px solid #8fc8e7;border-radius:7px;background:#eaf7ff;color:#073653;font-size:10px;font-weight:800;padding:0 5px}
.basic-picked{min-height:38px;display:flex;align-items:center;align-content:center;gap:5px;flex-wrap:wrap;padding:2px 2px 2px 5px}
.basic-player{display:flex;align-items:center;gap:4px;background:#fff;color:#12384e;border-radius:7px;padding:4px 6px;font-size:10px;font-weight:900;box-shadow:0 2px 6px #001b3344}
.basic-player img{width:18px;height:18px;object-fit:contain}
.basic-remove{border:0;background:transparent;color:#a72c35;font-weight:900;font-size:12px;padding:0;line-height:1;cursor:pointer}
.basic-select option:disabled{color:#a54b51;background:#f7dddd}
.basic-select option.basic-used{color:#71808a;background:#e5e8ea}
.goalie-row{border-bottom:0;margin-top:3px}
@media(max-width:380px){.basic-row{grid-template-columns:41% 59%}.basic-control label{font-size:8px}.basic-player{font-size:9px;padding:3px 5px}}
</style>
</head>

/*
  Each situation has:
  - upper blue team: 6 main players + 2 rotation players
  - lower white team: 6 main players + 2 rotation players
  Young and Old are independent.
  Skaters are globally unique across both situations and all positions.
  Goalies are shared between Young and Old, top and bottom separately.
*/
const POSITIONS=[
 ["ag","Goalie",0,"blue","main"],["ald","LD",1,"blue","main"],["ard","RD",2,"blue","main"],
 ["alw","LW",3,"blue","main"],["ac","CENTER",4,"blue","main"],["arw","RW",5,"blue","main"],
 ["bg","Goalie",6,"white","main"],["bld","LD",7,"white","main"],["brd","RD",8,"white","main"],
 ["blw","LW",9,"white","main"],["brw","RW",11,"white","main"],["bc","CENTER",10,"white","main"],
 ["rtl","Rotate D",12,"blue","rotation"],["rtr","Rotate W",13,"blue","rotation"],
 ["rbl","Rotate D",14,"white","rotation"],["rbr","Rotate W",15,"white","rotation"]
];

const state={young:Array(16).fill(""),old:Array(16).fill("")};
const basicState={
 blue:{oldD:[],oldF:[],youngD:[],youngF:[],goalie:""},
 white:{oldD:[],oldF:[],youngD:[],youngF:[],goalie:""}
};
const absent=new Set();
let activeMode="basic";

const CLASS={
 ag:"ag",ald:"ald",ard:"ard",alw:"alw",ac:"ac",arw:"arw",
 bg:"bg",bld:"bld",brd:"brd",blw:"blw",brw:"brw",bc:"bc",
 rtl:"rtl",rtr:"rtr",rbl:"rbl",rbr:"rbr"
};

const root=document.getElementById("slots");
const rinkScreen=document.getElementById("rinkScreen");
const basicScreen=document.getElementById("basicScreen");
const absentPanel=document.getElementById("absentPanel");
const absentList=document.getElementById("absentList");
const absentBtn=document.getElementById("absentBtn");
const basicBtn=document.getElementById("basicBtn");
const youngBtn=document.getElementById("youngBtn");
const oldBtn=document.getElementById("oldBtn");

function renderAbsentList(){
 absentList.innerHTML="";
 PLAYERS.forEach(name=>{
   const label=document.createElement("label");
   label.className="absent-item"+(absent.has(name)?" is-absent":"");
   const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=absent.has(name);
   const span=document.createElement("span"); span.className="absent-name"; span.textContent=name;
   cb.addEventListener("change",()=>{
     if(cb.checked){
       absent.add(name);
       for(const mode of ["young","old"]){
         for(let i=0;i<16;i++) if(i!==0&&i!==6&&state[mode][i]===name) state[mode][i]="";
       }
       for(const team of ["blue","white"]){
         for(const group of ["oldD","oldF","youngD","youngF"]){
           basicState[team][group]=basicState[team][group].filter(n=>n!==name);
         }
         if(basicState[team].goalie===name) basicState[team].goalie="";
       }
     }else absent.delete(name);
     renderAbsentList();
     if(activeMode==="basic") renderBasic(); else renderMode(activeMode);
   });
   label.appendChild(cb); label.appendChild(span);
   if(absent.has(name)){const x=document.createElement("span");x.className="absent-x";x.textContent="❌";label.appendChild(x)}
   absentList.appendChild(label);
 });
}

function saveVisible(){
 root.querySelectorAll("select").forEach(s=>state[activeMode][+s.dataset.index]=s.value);
}
function syncGoalies(){state.old[0]=state.young[0];state.old[6]=state.young[6];}
function usedSkaters(){
 const used=new Set();
 for(const mode of ["young","old"]){for(let i=0;i<16;i++)if(i!==0&&i!==6&&state[mode][i])used.add(state[mode][i]);}
 return used;
}
function applyLocks(){
 const used=usedSkaters();
 root.querySelectorAll("select").forEach(select=>{
   const index=+select.dataset.index,isGoalie=index===0||index===6,current=select.value;
   [...select.options].forEach(o=>{
     if(!o.value)return;
     const base=o.dataset.baseName||o.value;o.dataset.baseName=base;
     const absentLocked=absent.has(o.value),usedLocked=!isGoalie&&used.has(o.value)&&o.value!==current;
     o.disabled=absentLocked||usedLocked;
     o.classList.toggle("absent-option",absentLocked);
     o.textContent=absentLocked?"❌ "+base:usedLocked?"✓ "+base:base;
   });
 });
}

function fillMainSelect(select){
 select.innerHTML='<option value="">Izaberi igrača</option>'+
   PLAYERS.map(n=>'<option value="'+n.replace(/"/g,'&quot;')+'">'+n+'</option>').join('');
}

function renderMode(mode){
 root.innerHTML="";
 POSITIONS.forEach(([id,label,index,color,type])=>{
   const d=document.createElement("div");d.className="slot "+CLASS[id]+(type==="rotation"?" rotation":"");d.dataset.index=index;
   const select=document.createElement("select");select.dataset.index=index;fillMainSelect(select);select.value=state[mode][index]||"";
   d.innerHTML='<span class="lab">'+label+'</span>';d.appendChild(select);
   const mark=document.createElement("span");mark.className="mark";const img=document.createElement("img");img.className="jersey";img.src=color==="blue"?BLUE:WHITE;mark.appendChild(img);d.appendChild(mark);root.appendChild(d);
   select.addEventListener("change",onChange);
 });
 syncGoalies();
 if(mode==="old")root.querySelectorAll("select").forEach(s=>{const i=+s.dataset.index;if(i===0||i===6)s.value=state.young[i]||""});
 applyLocks();
}
function onChange(e){
 const s=e.target,index=+s.dataset.index,value=s.value;
 if(value&&absent.has(value)){s.value=state[activeMode][index]||"";return}
 state[activeMode][index]=value;
 if(index===0||index===6){state.young[index]=value;state.old[index]=value;syncGoalies();}
 applyLocks();
}

function basicUsed(){
 const used=new Set();
 for(const team of ["blue","white"]){
   for(const group of ["oldD","oldF","youngD","youngF"]){for(const n of basicState[team][group])if(n)used.add(n)}
   if(basicState[team].goalie)used.add(basicState[team].goalie);
 }
 return used;
}
function renderBasicSelects(){
 const used=basicUsed();
 document.querySelectorAll(".basic-select").forEach(select=>{
   const team=select.dataset.team,group=select.dataset.group,current=basicState[team][group];
   const old=select.value;
   select.innerHTML='<option value="">Dodaj igrača</option>';
   PLAYERS.forEach(name=>{
     const o=document.createElement("option");o.value=name;o.textContent=name;
     const locked=absent.has(name)||used.has(name);
     if(absent.has(name)){o.disabled=true;o.textContent="❌ "+name;o.style.background="#f8dddd";o.style.color="#b34a4a"}
     else if(locked){o.disabled=true;o.textContent="✓ "+name;o.style.background="#e5e8ea";o.style.color="#71808a"}
     select.appendChild(o);
   });
   if(old && [...select.options].some(o=>o.value===old&&!o.disabled))select.value=old; else select.value="";
 });
}
function renderPicked(team,group){
 const el=document.getElementById(team+group.charAt(0).toUpperCase()+group.slice(1)+"-picked");
 if(!el)return;
 el.innerHTML="";
 const val=basicState[team][group];
 const arr=Array.isArray(val)?val:(val?[val]:[]);
 arr.forEach((name,idx)=>{
   const chip=document.createElement("div");chip.className="basic-player";
   const img=document.createElement("img");img.src=team==="blue"?BLUE:WHITE;chip.appendChild(img);
   const txt=document.createElement("span");txt.textContent=name;chip.appendChild(txt);
   const rm=document.createElement("button");rm.className="basic-remove";rm.type="button";rm.textContent="×";
   rm.addEventListener("click",()=>{if(group==="goalie")basicState[team].goalie="";else basicState[team][group].splice(idx,1);renderBasic();});
   chip.appendChild(rm);el.appendChild(chip);
 });
}
function renderBasic(){
 ["blue","white"].forEach(team=>["oldD","oldF","youngD","youngF","goalie"].forEach(group=>renderPicked(team,group)));
 renderBasicSelects();
}
function basicChange(e){
 const s=e.target,name=s.value;if(!name)return;
 const team=s.dataset.team,group=s.dataset.group;
 if(absent.has(name)){s.value="";return}
 const used=basicUsed();if(used.has(name)){s.value="";return}
 if(group==="goalie")basicState[team].goalie=name;else basicState[team][group].push(name);
 s.value="";renderBasic();
}
document.querySelectorAll(".basic-select").forEach(s=>s.addEventListener("change",basicChange));

function switchMode(mode){
 if(activeMode!=="basic")saveVisible();
 syncGoalies();activeMode=mode;
 const isBasic=mode==="basic";
 basicScreen.classList.toggle("open",isBasic);rinkScreen.style.display=isBasic?"none":"block";
 basicBtn.classList.toggle("active",isBasic);youngBtn.classList.toggle("active",mode==="young");oldBtn.classList.toggle("active",mode==="old");
 if(isBasic)renderBasic();else renderMode(mode);
}
youngBtn.addEventListener("click",()=>switchMode("young"));
oldBtn.addEventListener("click",()=>switchMode("old"));
basicBtn.addEventListener("click",()=>switchMode("basic"));
absentBtn.addEventListener("click",()=>{absentPanel.classList.toggle("open");absentBtn.classList.toggle("active",absentPanel.classList.contains("open"));});
document.addEventListener("click",e=>{if(!e.target.closest(".absent-wrap")){absentPanel.classList.remove("open");absentBtn.classList.remove("active")}});

renderAbsentList();
renderBasic();
switchMode("basic");
</script>
</body>
</html>
