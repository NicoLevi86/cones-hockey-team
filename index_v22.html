<title>Cones Hockey Team v21</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0b131a;font-family:Arial,sans-serif;color:#fff}
body{padding:7px}.app{width:min(100%,520px);margin:auto}
.header{height:78px;display:flex;align-items:center;justify-content:center;padding:0}
.logo{width:155px;height:40px;object-fit:contain;display:block}
.brand{line-height:.9;font-weight:900}.cones{font-size:23px;color:#09abe9;letter-spacing:1px}
.hockey{font-size:10px;letter-spacing:2px;margin-top:3px}.belgrade{font-size:7px;letter-spacing:3px;color:#9ba6ae;margin-top:3px}
.tabs{display:flex;gap:6px;margin-bottom:7px}
.tab{flex:1;padding:10px;border-radius:9px;border:1px solid #4c5962;background:#27313a;color:#a8b0b5;font-weight:900;font-size:13px}
.tab.active{background:#08abe8;color:#fff;border-color:#08abe8;box-shadow:0 0 0 2px #087ca7,0 0 15px #08abe866}
.absent-wrap{position:relative;min-width:0}
.absent-btn{width:100%;padding:8px;border-radius:9px;border:1px solid #71333a;background:#2b2024;color:#ff8d96;font-weight:900;font-size:12px}
.absent-btn.active{background:#9b2833;color:#fff;border-color:#d94a56}
.absent-panel{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:30;background:#182128;border:1px solid #45535d;border-radius:10px;padding:8px;box-shadow:0 10px 25px #0009;max-height:65vh;overflow:auto}
.absent-panel.open{display:block}
.absent-title{font-size:11px;font-weight:900;color:#fff;margin:2px 3px 7px}
.absent-list{display:grid;grid-template-columns:1fr;gap:4px}
.absent-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;background:#253039;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.absent-item input{width:17px;height:17px;accent-color:#e0313e}
.absent-item.is-absent{background:#8d2630;color:#fff}
.absent-item.is-absent .absent-name{text-decoration:line-through}
.absent-x{margin-left:auto;font-size:14px}
.absent-note{font-size:9px;color:#aab3b9;margin:6px 3px 2px}

.slot{position:absolute;transform:translate(-50%,-50%);width:27%;z-index:5;text-align:center}
.slot select{width:100%;padding:5px 3px;border:1px solid #68757e;border-radius:7px;background:#fff;color:#111;font-size:9px;font-weight:700;box-shadow:0 2px 5px #0003}
.slot select option:disabled{color:#999;background:#dedede}
.slot select option.absent-option{color:#b34a4a;background:#f8dddd}
.lab{display:block;color:#0b1116;font-size:11px;font-weight:900;line-height:1;margin-bottom:2px;text-shadow:0 1px 0 #fff}
.mark{height:24px;display:flex;align-items:center;justify-content:center}
.jersey{width:22px;height:22px;object-fit:contain}
/* Main positions */
.ag{left:50%;top:13.4%}.ald{left:28%;top:25%}.ard{left:72%;top:25%}
.alw{left:28%;top:35.5%}.arw{left:72%;top:35.5%}.ac{left:50%;top:42%}
.bg{left:50%;top:86.6%}.bld{left:28%;top:75%}.brd{left:72%;top:75%}
.blw{left:28%;top:64.5%}.brw{left:72%;top:64.5%}.bc{left:50%;top:58%}
/* Rotation slots: upper-left/right corner and lower-left/right corner */
.rtl{left:17%;top:8.5%}.rtr{left:83%;top:8.5%}
.rbl{left:17%;top:91.5%}.rbr{left:83%;top:91.5%}
.rotation{width:21%}
.rotation .lab{font-size:10px}
.rotation .mark{height:22px}
.rotation .jersey{width:20px;height:20px}
@media(max-width:380px){
 .slot{width:29%}.slot select{font-size:8px;padding:5px}
 .lab{font-size:10px}.jersey{width:20px;height:20px}
 .rotation{width:23%}.rotation .lab{font-size:9px}
}

.top-actions{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:6px;margin:0 0 4px;align-items:start}
.action-btn{padding:8px 10px;border-radius:8px;font-weight:900;font-size:11px;letter-spacing:.5px;cursor:pointer}
.save-btn{border:1px solid #1e8b58;background:#173a2b;color:#6ff0ad}
.save-btn:active{transform:scale(.98)}
.reset-btn{border:1px solid #7b4248;background:#322126;color:#ff9aa1}
.reset-btn:active{transform:scale(.98)}
.save-status{font-size:10px;color:#7ee7b0;text-align:center;margin:-3px 0 6px;min-height:12px}
/* BASIC lineup screen v19 */
.basic-screen{display:none;min-height:calc(100vh - 125px);background:#07528a;border:1px solid #0b78b7;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 30px #001b33aa}
.basic-screen.open{display:block}
.basic-team{padding:12px 0 16px}
.basic-blue{background:#07528a}
.basic-white{background:#0b63a0;border-top:4px solid #d8e5ec}
.basic-team-title{display:flex;align-items:center;justify-content:flex-start;gap:9px;font-size:18px;font-weight:900;letter-spacing:1px;margin:0 0 12px;text-align:left;color:#fff;padding:0}
.basic-team-title img{width:28px;height:28px;object-fit:contain;flex:0 0 30px}.basic-team-title .title-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}.basic-team-title .title-sub{font-size:9px;letter-spacing:1px;color:#b8d8ea;margin-top:4px}
.basic-row{display:block;padding:7px 10px 10px;border-bottom:1px solid #ffffff22}
.basic-row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.basic-control label{display:block;font-size:12px;font-weight:900;color:#eaf7ff;text-transform:uppercase;letter-spacing:.2px}
.basic-add{border:1px solid #79d8ff;background:#09abe9;color:#fff;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:900;min-width:56px;width:56px;cursor:pointer;box-shadow:0 2px 7px #001b3344}
.basic-add:active{transform:scale(.97)}
.basic-picked{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:row;gap:6px;min-height:36px}
.basic-picked.defense-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row}
.basic-picked.goalie-grid{grid-template-columns:minmax(0,1fr)}
.basic-player{display:flex;align-items:center;justify-content:center;gap:5px;background:#eaf7ff;color:#12384e;border-radius:7px;padding:7px 5px;font-size:12px;font-weight:900;box-shadow:0 2px 6px #001b3344;min-width:0;text-align:center}
.basic-player img{width:19px;height:19px;object-fit:contain;flex:0 0 19px}.basic-player .player-name{display:block;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
.basic-remove{border:0;background:transparent;color:#a72c35;font-weight:900;font-size:14px;padding:0;line-height:1;cursor:pointer;flex:0 0 auto}
.basic-empty{font-size:10px;color:#b8d8ea;padding:7px 2px;opacity:.8}
@media(max-width:380px){.basic-team{padding:10px 8px 14px}.basic-team-title{font-size:16px}.basic-player{font-size:11px;padding:6px 4px}.basic-player img{width:17px;height:17px;flex-basis:17px}}

.player-modal{display:none;position:fixed;inset:0;z-index:100;background:#000b;align-items:flex-end;justify-content:center;padding:10px}.player-modal.open{display:flex}.player-modal-card{width:min(100%,520px);max-height:78vh;background:#17232b;border:1px solid #4d6878;border-radius:14px 14px 8px 8px;box-shadow:0 -10px 35px #000b;overflow:hidden}.player-modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#0b131a;border-bottom:1px solid #31434e;color:#fff}.player-modal-close{border:0;background:#2b2024;color:#ff9aa1;font-size:22px;font-weight:900;width:34px;height:34px;border-radius:8px}.player-modal-list{padding:8px;overflow:auto;max-height:66vh;display:grid;grid-template-columns:1fr;gap:5px}.player-choice{width:100%;text-align:left;border:1px solid #547080;background:#eaf7ff;color:#12384e;border-radius:8px;padding:9px 10px;font-size:11px;font-weight:800}.player-choice:disabled{background:#e5e8ea;color:#71808a;border-color:#89969d}.player-choice.absent-choice{background:#f8dddd;color:#b34a4a;border-color:#d99a9a}.player-choice.selected-choice{background:#dff4e4;color:#236b38;border-color:#8bc99a}
</style>

/*
  Each situation has:
  - upper blue team: 6 main players + 2 rotation players
  - lower white team: 6 main players + 2 rotation players
  Young and Old are independent.
  Skaters are globally unique across both situations and all positions.
  Goalies are shared between Young and Old, top and bottom separately.
*/
const POSITIONS=[
 ["ag","Goalie",0,"blue","main"],["ald","LD",1,"blue","main"],["ard","RD",2,"blue","main"],
 ["alw","LW",3,"blue","main"],["ac","CENTER",4,"blue","main"],["arw","RW",5,"blue","main"],
 ["bg","Goalie",6,"white","main"],["bld","LD",7,"white","main"],["brd","RD",8,"white","main"],
 ["blw","LW",9,"white","main"],["brw","RW",11,"white","main"],["bc","CENTER",10,"white","main"],
 ["rtl","Rotate D",12,"blue","rotation"],["rtr","Rotate W",13,"blue","rotation"],
 ["rbl","Rotate D",14,"white","rotation"],["rbr","Rotate W",15,"white","rotation"]
];

const state={young:Array(16).fill(""),old:Array(16).fill("")};
const basicState={
 blue:{oldD:[],oldF:[],youngD:[],youngF:[],goalie:""},
 white:{oldD:[],oldF:[],youngD:[],youngF:[],goalie:""}
};
const absent=new Set();
let activeMode="basic";

const CLASS={
 ag:"ag",ald:"ald",ard:"ard",alw:"alw",ac:"ac",arw:"arw",
 bg:"bg",bld:"bld",brd:"brd",blw:"blw",brw:"brw",bc:"bc",
 rtl:"rtl",rtr:"rtr",rbl:"rbl",rbr:"rbr"
};

const root=document.getElementById("slots");
const rinkScreen=document.getElementById("rinkScreen");
const basicScreen=document.getElementById("basicScreen");
const absentPanel=document.getElementById("absentPanel");
const absentList=document.getElementById("absentList");
const absentBtn=document.getElementById("absentBtn");
const basicBtn=document.getElementById("basicBtn");
const youngBtn=document.getElementById("youngBtn");
const oldBtn=document.getElementById("oldBtn");

const saveBtn=document.getElementById("saveBtn");
const resetBtn=document.getElementById("resetBtn");
const saveStatus=document.getElementById("saveStatus");
const STORAGE_KEY="cones-hockey-team-state-v22";

function snapshotState(){
 if(activeMode!=="basic")saveVisible();
 syncGoalies();
 return {
   state:{young:[...state.young],old:[...state.old]},
   basicState:{
     blue:{oldD:[...basicState.blue.oldD],oldF:[...basicState.blue.oldF],youngD:[...basicState.blue.youngD],youngF:[...basicState.blue.youngF],goalie:basicState.blue.goalie||""},
     white:{oldD:[...basicState.white.oldD],oldF:[...basicState.white.oldF],youngD:[...basicState.white.youngD],youngF:[...basicState.white.youngF],goalie:basicState.white.goalie||""}
   },
   absent:[...absent],
   activeMode
 };
}
function showSaveStatus(msg){
 saveStatus.textContent=msg;
 clearTimeout(showSaveStatus._t);
 showSaveStatus._t=setTimeout(()=>saveStatus.textContent="",1800);
}
function saveAll(){
 const data=snapshotState();
 localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
 showSaveStatus("POSTAVA SAČUVANA ✓");
}
function loadSaved(){
 try{
   const raw=localStorage.getItem(STORAGE_KEY);
   if(!raw)return false;
   const data=JSON.parse(raw);
   const alias={"Miodrag Kovanović":"Mićko","Dragan Komazec":"Poglavica","Atanasije Gligorijević":"Tasa","Miodrag Ristović":"Rista","Jovan Petrović":"Joca","Filip Bugarski":"Smajser","Nikola Đukić":"Levi","Predrag Joković":"Pegula","Vladimir Halasev":"Halasev","Dušan Damnjanović":"Dule","Igor Gligorijević":"Gliga","Aleksa Despotović":"Despot","Boris Krčadinac":"Boris VHV","Luka Dragačević":"Dragač","Dmitrii Demianenko":"Dma","Filip Gligorijević":"Filća","Miroslav Milovanovic Ristic":"Hemija","Saša Radosavljević":"Groovyman","Lazar Radakovic":"Lazar","Nikola Krstic":"Krsta","Ognjen Stojiljkovic":"Ogi","Pavle Gošić":"Desni","Petar Ogrizovic":"Ogriz"};
   const migrate=n=>alias[n]||n;
   if(data?.state?.young?.length===16)state.young=data.state.young.slice(0,16).map(migrate);
   if(data?.state?.old?.length===16)state.old=data.state.old.slice(0,16).map(migrate);
   if(data?.basicState?.blue)Object.assign(basicState.blue,data.basicState.blue);
   if(data?.basicState?.white)Object.assign(basicState.white,data.basicState.white);
   for(const team of ["blue","white"]){for(const group of ["oldD","oldF","youngD","youngF"]){basicState[team][group]=(Array.isArray(basicState[team][group])?basicState[team][group]:[]).map(migrate).filter(n=>PLAYERS.includes(n));}basicState[team].goalie=migrate(basicState[team].goalie||"");if(basicState[team].goalie&&!PLAYERS.includes(basicState[team].goalie))basicState[team].goalie="";}
   absent.clear();
   if(Array.isArray(data?.absent))data.absent.forEach(n=>{const m=migrate(n);if(PLAYERS.includes(m))absent.add(m)});
   activeMode=["basic","young","old"].includes(data?.activeMode)?data.activeMode:"basic";
   syncGoalies();
   return true;
 }catch(e){localStorage.removeItem(STORAGE_KEY);return false}
}
function resetAll(){
 if(!confirm("Da li zelis da resetujes?"))return;
 state.young.fill("");state.old.fill("");
 for(const team of ["blue","white"]){
   basicState[team].oldD=[];basicState[team].oldF=[];basicState[team].youngD=[];basicState[team].youngF=[];basicState[team].goalie="";
 }
 absent.clear();
 activeMode="basic";
 localStorage.removeItem(STORAGE_KEY);
 renderAbsentList();
 switchMode("basic");
 showSaveStatus("RESETOVANO ✓");
}

function renderAbsentList(){
 absentList.innerHTML="";
 PLAYERS.forEach(name=>{
   const label=document.createElement("label");
   label.className="absent-item"+(absent.has(name)?" is-absent":"");
   const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=absent.has(name);
   const span=document.createElement("span"); span.className="absent-name"; span.textContent=name;
   cb.addEventListener("change",()=>{
     if(cb.checked){
       absent.add(name);
       for(const mode of ["young","old"]){
         for(let i=0;i<16;i++) if(i!==0&&i!==6&&state[mode][i]===name) state[mode][i]="";
       }
       for(const team of ["blue","white"]){
         for(const group of ["oldD","oldF","youngD","youngF"]){
           basicState[team][group]=basicState[team][group].filter(n=>n!==name);
         }
         if(basicState[team].goalie===name) basicState[team].goalie="";
       }
     }else absent.delete(name);
     renderAbsentList();
     if(activeMode==="basic") renderBasic(); else renderMode(activeMode);
   });
   label.appendChild(cb); label.appendChild(span);
   if(absent.has(name)){const x=document.createElement("span");x.className="absent-x";x.textContent="❌";label.appendChild(x)}
   absentList.appendChild(label);
 });
}

function saveVisible(){
 root.querySelectorAll("select").forEach(s=>state[activeMode][+s.dataset.index]=s.value);
}
function syncGoalies(){state.old[0]=state.young[0];state.old[6]=state.young[6];}
function usedSkaters(){
 const used=new Set();
 for(const mode of ["young","old"]){for(let i=0;i<16;i++)if(i!==0&&i!==6&&state[mode][i])used.add(state[mode][i]);}
 return used;
}
function applyLocks(){
 const used=usedSkaters();
 root.querySelectorAll("select").forEach(select=>{
   const index=+select.dataset.index,isGoalie=index===0||index===6,current=select.value;
   [...select.options].forEach(o=>{
     if(!o.value)return;
     const base=o.dataset.baseName||o.value;o.dataset.baseName=base;
     const absentLocked=absent.has(o.value),usedLocked=!isGoalie&&used.has(o.value)&&o.value!==current;
     o.disabled=absentLocked||usedLocked;
     o.classList.toggle("absent-option",absentLocked);
     o.textContent=absentLocked?"❌ "+base:usedLocked?"✓ "+base:base;
   });
 });
}

function fillMainSelect(select){
 select.innerHTML='<option value="">Izaberi igrača</option>'+
   PLAYERS.map(n=>'<option value="'+n.replace(/"/g,'&quot;')+'">'+n+'</option>').join('');
}

function renderMode(mode){
 root.innerHTML="";
 POSITIONS.forEach(([id,label,index,color,type])=>{
   const d=document.createElement("div");d.className="slot "+CLASS[id]+(type==="rotation"?" rotation":"");d.dataset.index=index;
   const select=document.createElement("select");select.dataset.index=index;fillMainSelect(select);select.value=state[mode][index]||"";
   d.innerHTML='<span class="lab">'+label+'</span>';d.appendChild(select);
   const mark=document.createElement("span");mark.className="mark";const img=document.createElement("img");img.className="jersey";img.src=color==="blue"?BLUE:WHITE;mark.appendChild(img);d.appendChild(mark);root.appendChild(d);
   select.addEventListener("change",onChange);
 });
 syncGoalies();
 if(mode==="old")root.querySelectorAll("select").forEach(s=>{const i=+s.dataset.index;if(i===0||i===6)s.value=state.young[i]||""});
 applyLocks();
}
function onChange(e){
 const s=e.target,index=+s.dataset.index,value=s.value;
 if(value&&absent.has(value)){s.value=state[activeMode][index]||"";return}
 state[activeMode][index]=value;
 if(index===0||index===6){state.young[index]=value;state.old[index]=value;syncGoalies();}
 applyLocks();
}

function basicUsed(){
 const used=new Set();
 for(const team of ["blue","white"]){
   for(const group of ["oldD","oldF","youngD","youngF"]){for(const n of basicState[team][group])if(n)used.add(n)}
   if(basicState[team].goalie)used.add(basicState[team].goalie);
 }
 return used;
}
let modalTarget=null;
const playerModal=document.getElementById("playerModal");
const playerModalList=document.getElementById("playerModalList");
const playerModalTitle=document.getElementById("playerModalTitle");
const playerModalClose=document.getElementById("playerModalClose");
function openPlayerModal(team,group){
 modalTarget={team,group};
 playerModalTitle.textContent="Izaberi igrača — "+(group==="oldD"?"Bekovi Stariji":group==="oldF"?"Napadači Stariji":group==="youngD"?"Bekovi Mladji":group==="youngF"?"Napadači Mladji":"Golman");
 playerModalList.innerHTML="";
 const used=basicUsed();
 PLAYERS.forEach(name=>{
   const b=document.createElement("button");b.type="button";b.className="player-choice";b.textContent=name;
   const isAbsent=absent.has(name), isSelected=used.has(name);
   if(isAbsent){
     b.disabled=true;
     b.classList.add("absent-choice");
     b.textContent="❌ "+name;
   }else if(isSelected){
     b.disabled=true;
     b.classList.add("selected-choice");
     b.textContent="✓ "+name;
   }
   b.addEventListener("click",()=>{
     if(b.disabled||!modalTarget)return;
     const {team,group}=modalTarget;
     if(group==="goalie")basicState[team].goalie=name;else basicState[team][group].push(name);
     closePlayerModal();renderBasic();
   });
   playerModalList.appendChild(b);
 });
 playerModal.classList.add("open");
}
function closePlayerModal(){modalTarget=null;playerModal.classList.remove("open");}
playerModalClose.addEventListener("click",closePlayerModal);
playerModal.addEventListener("click",e=>{if(e.target===playerModal)closePlayerModal()});
document.querySelectorAll(".basic-add").forEach(b=>b.addEventListener("click",()=>openPlayerModal(b.dataset.team,b.dataset.group)));
function shortPlayerName(name){
 const parts=name.trim().split(/\s+/);
 if(parts.length<2)return name;
 return parts[0]+" "+parts[parts.length-1].charAt(0)+".";
}
function fitPlayerNames(){
 document.querySelectorAll(".basic-player .player-name").forEach(span=>{
   const full=span.dataset.full||span.textContent;
   span.textContent=full;
   if(span.scrollWidth>span.clientWidth){
     span.textContent=shortPlayerName(full);
     if(span.scrollWidth>span.clientWidth){
       span.textContent=full.trim().split(/\s+/)[0];
     }
   }
 });
}
function renderPicked(team,group){
 const el=document.getElementById(team+group.charAt(0).toUpperCase()+group.slice(1)+"-picked");
 if(!el)return;
 el.innerHTML="";
 const val=basicState[team][group];
 const arr=Array.isArray(val)?val:(val?[val]:[]);
 if(!arr.length){const empty=document.createElement("div");empty.className="basic-empty";empty.textContent="Nema izabranih igrača";el.appendChild(empty);return;}
 arr.forEach((name,idx)=>{
   const chip=document.createElement("div");chip.className="basic-player";
   const img=document.createElement("img");img.src=team==="blue"?BLUE:WHITE;chip.appendChild(img);
   const txt=document.createElement("span");txt.className="player-name";txt.dataset.full=name;txt.textContent=name;chip.appendChild(txt);
   const rm=document.createElement("button");rm.className="basic-remove";rm.type="button";rm.textContent="×";
   rm.addEventListener("click",()=>{if(group==="goalie")basicState[team].goalie="";else basicState[team][group].splice(idx,1);renderBasic();});
   chip.appendChild(rm);el.appendChild(chip);
 });
}
function renderBasic(){
 ["blue","white"].forEach(team=>["oldD","oldF","youngD","youngF","goalie"].forEach(group=>renderPicked(team,group)));
 requestAnimationFrame(fitPlayerNames);
}
function switchMode(mode){
 if(activeMode!=="basic")saveVisible();
 syncGoalies();activeMode=mode;
 const isBasic=mode==="basic";
 basicScreen.classList.toggle("open",isBasic);rinkScreen.style.display=isBasic?"none":"block";
 basicBtn.classList.toggle("active",isBasic);youngBtn.classList.toggle("active",mode==="young");oldBtn.classList.toggle("active",mode==="old");
 if(isBasic)renderBasic();else renderMode(mode);
}
youngBtn.addEventListener("click",()=>switchMode("young"));
oldBtn.addEventListener("click",()=>switchMode("old"));
basicBtn.addEventListener("click",()=>switchMode("basic"));
absentBtn.addEventListener("click",()=>{absentPanel.classList.toggle("open");absentBtn.classList.toggle("active",absentPanel.classList.contains("open"));});
document.addEventListener("click",e=>{if(!e.target.closest(".absent-wrap")){absentPanel.classList.remove("open");absentBtn.classList.remove("active")}});

saveBtn.addEventListener("click",saveAll);
resetBtn.addEventListener("click",resetAll);
loadSaved();
renderAbsentList();
renderBasic();
switchMode(activeMode);
</script>
</body>
</html>
